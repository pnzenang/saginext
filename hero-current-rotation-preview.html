<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAGI Current Hero Rotation</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f3ee;
        color: #162019;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1240px, calc(100% - 32px));
        margin: 0 auto;
        padding: 36px 0 56px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 44px);
        line-height: 1;
      }

      p {
        max-width: 780px;
        margin: 0;
        color: #4f5b52;
        font-size: 16px;
        line-height: 1.55;
      }

      .count {
        flex: 0 0 auto;
        border-radius: 999px;
        background: #173f31;
        color: #fff;
        padding: 10px 16px;
        font-weight: 800;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid #d7d0c4;
        border-radius: 8px;
        background: #fffdf8;
        box-shadow: 0 14px 40px rgb(22 32 25 / 10%);
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #d7d0c4;
      }

      figcaption {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        padding: 12px 14px;
      }

      strong {
        display: inline-flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #173f31;
        color: #fff;
        font-size: 14px;
      }

      span {
        min-width: 0;
        overflow: hidden;
        color: #3e473f;
        font-size: 13px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (max-width: 720px) {
        header {
          display: block;
        }

        .count {
          display: inline-flex;
          margin-top: 16px;
        }
      }
    </style>
  </head>
