<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0CA25A" />
    <title>SAGI is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #d9e2e7;
        border-radius: 8px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 18px 45px rgb(15 23 42 / 0.08);
      }

      img {
        width: 68px;
        height: 68px;
        display: block;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 1.45rem;
        line-height: 1.2;
      }

      p {
        margin: 12px 0 0;
        color: #475569;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 22px;
        border-radius: 999px;
        background: #0ca25a;
        color: #ffffff;
        padding: 0 18px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon/android-chrome-192x192.png" alt="SAGI" />
      <h1>SAGI needs a connection</h1>
      <p>
        The mobile app is installed, but member records and payments need an internet connection to stay current.
      </p>
      <a href="/sign-in">Try again</a>
    </main>
  </body>
</html>
